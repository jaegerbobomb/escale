[project]
name = "escale-flet"
version = "0.19.0"
description = "Escale user interface built with Flet."
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "escale-core",
    "flet>=1.1",
    # Ticket barcodes, drawn on the device (S015); all under permissive licences.
    "aztec-code-generator>=0.12",
    "pdf417gen>=0.8",
    "pillow>=11",
    "python-barcode>=0.16",
    "segno>=1.6",
]

[project.optional-dependencies]
desktop = ["flet[desktop]>=1.1"]
web = ["flet[web]>=1.1"]

[project.scripts]
escale = "escale_flet.app:run"

[tool.uv.sources]
escale-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/escale_flet"]
