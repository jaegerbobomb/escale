[project]
name = "escale-core"
version = "0.10.0"
description = "Escale core: domain, services and adapters. Never imports a UI toolkit."
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = []

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/escale_core"]
