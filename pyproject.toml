[project]
name = "escale-workspace"
version = "0.17.0"
description = "Escale workspace root (not published)."
requires-python = ">=3.12"
license = "GPL-3.0-or-later"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "flet[web]>=1.1",
    "mypy>=2.4",
    "playwright>=1.63",
    "pytest>=9.2",
    "pytest-bdd>=9.0",
    "ruff>=0.17",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# scripts/ is vendored from the StorySpec kit: keep it byte-identical to upstream.
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

# Typography used on purpose in UI strings: en dash for ranges, arrow, middle dot.
allowed-confusables = ["–", "→", "·", "‹"]

[tool.ruff.lint.isort]
known-first-party = ["escale_core", "escale_flet"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["packages/escale-core/src", "packages/escale-flet/src"]
files = ["packages", "tools"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["escale_core", "escale_core.*"]
strict = true

[[tool.mypy.overrides]]
# Barcode libraries without type information.
module = ["aztec_code_generator", "barcode", "barcode.*", "pdf417gen"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "packages/escale-core/tests", "packages/escale-flet/tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
bdd_features_base_dir = "tests/features/"
