[project]
name = "escale-workspace"
version = "0.1.0"
description = "Escale workspace root (not published)."
requires-python = ">=3.12"
license = "GPL-3.0-or-later"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.2",
    "pytest-bdd>=9.0",
    "ruff>=0.17",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# scripts/ is vendored from the StorySpec kit: keep it byte-identical to upstream.
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["packages/escale-core/src", "packages/escale-flet/src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["escale_core", "escale_core.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests", "packages/escale-core/tests", "packages/escale-flet/tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
